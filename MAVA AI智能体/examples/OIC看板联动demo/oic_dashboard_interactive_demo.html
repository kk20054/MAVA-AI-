<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAVA AI 经营看板 Demo</title>
  <style>
    :root{
      --red:#c20f1f;
      --red-dark:#8f0d18;
      --red-soft:#fff1f3;
      --teal:#087f8c;
      --teal-soft:#e8f7f8;
      --green:#057a55;
      --amber:#b7791f;
      --ink:#172033;
      --muted:#64748b;
      --line:#d7dee9;
      --soft:#f4f7fb;
      --panel:#fff;
      --blue:#2c5aa0;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--soft);
      color:var(--ink);
      font-family:"Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;
      letter-spacing:0;
    }
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{
      height:100vh;
      min-width:1180px;
      display:grid;
      grid-template-rows:64px 1fr;
      overflow:hidden;
    }
    .topbar{
      display:flex;
      align-items:center;
      gap:18px;
      background:#fff;
      border-bottom:1px solid var(--line);
      padding:0 22px;
    }
    .brand{
      display:flex;
      align-items:center;
      width:430px;
      white-space:nowrap;
    }
    .brand-logo{
      width:410px;
      height:48px;
      object-fit:contain;
      display:block;
    }
    .title{
      padding-left:18px;
      border-left:1px solid var(--line);
      font-size:18px;
      font-weight:800;
      min-width:320px;
    }
    .top-actions{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .control{
      height:38px;
      border:1px solid var(--line);
      background:#fff;
      color:#334155;
      border-radius:7px;
      padding:0 12px;
      min-width:130px;
    }
    .shell{
      min-height:0;
      height:calc(100vh - 64px);
      display:grid;
      grid-template-columns:minmax(760px,1fr) 8px var(--assistant-width,440px);
    }
    .workspace{
      overflow:auto;
      padding:18px;
    }
    .page-head{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:18px;
      margin-bottom:12px;
    }
    .title-row{
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .page-head h1{
      margin:0;
      font-size:22px;
      line-height:1.25;
    }
    .scope-select{
      min-width:116px;
      height:34px;
      border-radius:7px;
      border:1px solid var(--line);
      background:#fff;
      color:#334155;
      padding:0 10px;
      font-weight:800;
    }
    .health{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
      margin-top:3px;
    }
    .health::before{
      content:"";
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--green);
    }
    .kpis{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
      margin-bottom:12px;
    }
    .kpi{
      position:relative;
      min-height:150px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--panel);
      padding:14px;
      overflow:hidden;
      transition:transform .16s ease,box-shadow .16s ease,border .16s ease;
      text-align:left;
    }
    .kpi:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(20,31,54,.07)}
    .kpi.active{
      border:2px solid var(--red);
      background:linear-gradient(180deg,#fff5f6 0%,#fff 78%);
    }
    .kpi.active::after{
      content:"ACTIVE";
      position:absolute;
      top:12px;
      right:12px;
      color:var(--red-dark);
      font-weight:900;
      font-size:11px;
      letter-spacing:0;
    }
    .kpi-name{font-size:15px;font-weight:900;margin-bottom:14px}
    .kpi-value{font-size:32px;font-weight:900;line-height:1.1}
    .kpi-unit{font-size:13px;color:#475569;margin-left:5px;font-weight:700}
    .kpi-grid{
      margin-top:13px;
      display:grid;
      grid-template-columns:58px 1fr 62px;
      gap:4px 7px;
      font-size:12px;
      color:#334155;
      align-items:center;
    }
    .pos{color:var(--green);font-weight:800}
    .neg{color:var(--red);font-weight:800}
    .warn{color:var(--amber);font-weight:800}
    .dashboard-grid{
      display:grid;
      grid-template-columns:1fr 1fr 1.18fr;
      gap:12px;
      margin-bottom:12px;
    }
    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:8px;
      min-height:292px;
      padding:14px;
    }
    .panel.expanded-panel{
      grid-column:1 / -1;
      min-height:420px;
    }
    .panel.expanded-panel svg{height:318px}
    .customer-section{
      min-height:290px;
      margin-bottom:14px;
    }
    .customer-section.expanded-panel{min-height:430px}
    .panel-head{
      display:flex;
      justify-content:space-between;
      align-items:start;
      gap:12px;
      margin-bottom:9px;
    }
    .panel h2{
      margin:0;
      font-size:16px;
      line-height:1.3;
    }
    .meta{
      color:var(--muted);
      font-size:12px;
      margin-top:3px;
      line-height:1.35;
    }
    .toolbar{
      display:flex;
      gap:6px;
      align-items:center;
    }
    .range-toggle{
      display:flex;
      gap:0;
      border-radius:7px;
      overflow:hidden;
      border:1px solid #efb8be;
      background:#fff;
    }
    .range-btn{
      height:30px;
      border:0;
      background:#fff;
      color:var(--red-dark);
      min-width:44px;
      padding:0 9px;
      font-weight:900;
    }
    .range-btn + .range-btn{border-left:1px solid #efb8be}
    .range-btn.active{
      color:#fff;
      background:linear-gradient(90deg,#c20f1f,#e0434d);
    }
    .icon-btn{
      width:32px;
      height:32px;
      border:1px solid var(--line);
      border-radius:7px;
      background:#fff;
      color:#475569;
      font-weight:900;
      display:inline-grid;
      place-items:center;
    }
    .icon-btn:hover{border-color:#b8c3d3;background:#f8fafc}
    .expand-btn{
      color:#334155;
      background:#f8fafc;
      border-color:#dbe3ef;
    }
    .expand-btn:hover{
      color:#fff;
      border-color:#c20f1f;
      background:linear-gradient(135deg,#c20f1f,#e0434d);
    }
    .variance{
      position:relative;
      height:18px;
      border-radius:999px;
      overflow:hidden;
      padding:0 6px;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      min-width:58px;
      background:#f1f5f9;
      isolation:isolate;
    }
    .variance::before{
      content:"";
      position:absolute;
      inset:0 auto 0 0;
      width:calc(var(--p, 20) * 1%);
      max-width:100%;
      border-radius:999px;
      opacity:.22;
      background:var(--green);
      z-index:-1;
    }
    .variance.neg::before{background:var(--red)}
    .variance span{position:relative}
    svg{display:block;width:100%;height:210px}
    .legend-text{font-size:12px;fill:#334155;font-weight:800}
    table{
      width:100%;
      border-collapse:collapse;
      font-size:12px;
    }
    th{
      text-align:left;
      background:#f1f5f9;
      color:#475569;
      padding:8px;
      border-bottom:1px solid var(--line);
      font-weight:900;
      white-space:nowrap;
    }
    td{
      padding:7px 8px;
      border-bottom:1px solid #e9eef5;
      white-space:nowrap;
    }
    tr[data-row]{cursor:pointer}
    tr[data-row]:hover td{background:#fff8f8}
    tr.selected td{background:var(--red-soft)!important}
    tr.total-row td{
      background:#f8fafc;
      border-top:1px solid var(--line);
      font-weight:900;
    }
    .bar-wrap{
      position:relative;
      min-width:78px;
    }
    .bar-bg{
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      height:auto;
      border-radius:0 999px 999px 0;
      background:var(--teal);
      opacity:.14;
      min-width:20px;
    }
    .bar-bg.down{background:var(--red)}
    .bar-text{
      position:relative;
      font-weight:900;
      display:inline-flex;
      min-height:100%;
      align-items:center;
      padding-left:6px;
    }
    .resizer{
      width:8px;
      background:linear-gradient(90deg,#eef2f7 0,#fff 50%,#eef2f7 100%);
      border-left:1px solid var(--line);
      border-right:1px solid var(--line);
      cursor:col-resize;
      position:relative;
    }
    .resizer::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:3px;
      height:42px;
      border-radius:3px;
      transform:translate(-50%,-50%);
      background:#b8c3d3;
    }
    .resizer.dragging::after{background:var(--red)}
    .assistant{
      min-width:0;
      background:#fff;
      display:grid;
      grid-template-rows:58px minmax(0,1fr) auto;
    }
    .assistant-head{
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      font-weight:900;
      font-size:17px;
    }
    .assistant-actions{
      display:flex;
      gap:6px;
    }
    .assistant-body{
      overflow:auto;
      padding:15px;
    }
    .assistant-footer{
      border-top:1px solid var(--line);
      background:#fff;
      padding:10px 15px 12px;
    }
    .context{
      border:1px solid #f0c2c7;
      background:#fff;
      border-radius:8px;
      padding:0;
      margin-bottom:12px;
      position:relative;
      overflow:hidden;
    }
    .context::before{
      content:"";
      position:absolute;
      left:-16px;
      top:46px;
      width:16px;
      height:2px;
      background:var(--red);
    }
    .context-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color:#fff;
      background:linear-gradient(90deg,#9f0d18,#c20f1f);
      font-weight:900;
      padding:11px 12px;
    }
    .sync-pill{
      color:#fff;
      background:rgba(255,255,255,.16);
      border:1px solid rgba(255,255,255,.35);
      border-radius:999px;
      padding:2px 8px;
      font-size:11px;
      font-weight:900;
    }
    .ctx-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      font-size:13px;
      padding:12px;
    }
    .ctx-grid div{
      border:1px solid #edf1f6;
      background:#fbfcfe;
      border-radius:7px;
      padding:8px;
      min-width:0;
    }
    .ctx-grid span{
      display:block;
      color:var(--muted);
      font-size:11px;
      margin-bottom:4px;
    }
    .ctx-grid b{
      display:block;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .ctx-note{
      margin:0 12px 12px;
      color:#8f0d18;
      font-size:12px;
      line-height:1.4;
      background:#fff7f8;
      border:1px solid #f2d4d8;
      border-radius:7px;
      padding:8px;
    }
    .analysis{
      border:1px solid var(--line);
      background:#f8fafc;
      border-radius:8px;
      padding:14px;
      margin-bottom:13px;
      font-size:13px;
      line-height:1.65;
    }
    .analysis h3{
      margin:0 0 8px;
      font-size:15px;
    }
    .module-copy{
      display:grid;
      gap:8px;
    }
    .module-copy b{color:var(--red-dark)}
    .question-grid{
      display:flex;
      gap:8px;
      margin-bottom:13px;
      flex-wrap:wrap;
    }
    .question-card{
      text-align:left;
      border:1px solid #d8dee8;
      background:#f3f5f8;
      border-radius:999px;
      padding:7px 12px;
      color:#334155;
      max-width:100%;
      white-space:normal;
      line-height:1.35;
    }
    .question-card:hover{
      background:#e8edf4;
      border-color:#c5cfdd;
      color:#111827;
    }
    .assistant-buttons{
      display:flex;
      gap:8px;
      margin-bottom:9px;
      flex-wrap:wrap;
    }
    .secondary{
      height:34px;
      border:1px solid var(--line);
      background:#fff;
      color:#334155;
      border-radius:7px;
      padding:0 11px;
    }
    .secondary.primary{
      border-color:#9dd2d7;
      background:var(--teal-soft);
      color:var(--teal);
      font-weight:900;
    }
    .ask{
      border:1px solid var(--line);
      border-radius:8px;
      min-height:44px;
      display:flex;
      align-items:center;
      padding:0 8px;
      gap:8px;
      background:#fff;
    }
    .ask input{
      flex:1;
      min-width:0;
      border:0;
      outline:0;
      color:#334155;
      font-size:13px;
    }
    .send{
      height:30px;
      border:0;
      border-radius:7px;
      background:var(--red);
      color:#fff;
      padding:0 12px;
      font-weight:800;
    }
    .event-log{display:none}
    .flash{animation:flash .55s ease}
    @keyframes flash{
      0%{box-shadow:0 0 0 0 rgba(194,15,31,.28)}
      100%{box-shadow:0 0 0 12px rgba(194,15,31,0)}
    }
    @media(max-width:1480px){
      .shell{grid-template-columns:minmax(720px,1fr) 8px var(--assistant-width,410px)}
      .brand{width:430px}
      .brand-logo{width:410px}
      .dashboard-grid{grid-template-columns:1fr 1fr}
      .dashboard-grid .panel:nth-child(3){grid-column:1 / 3}
      .kpi-value{font-size:28px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><img class="brand-logo" src="icbc_asia_logo.svg" alt="ICBC Asia" /></div>
      <div class="title">MAVA AI 智能财会助手 · 经营看板</div>
      <div class="top-actions">
        <input class="control" id="dateInput" value="2026-05-05" aria-label="数据日期" />
        <input class="control" id="oicInput" value="EE001408023" aria-label="访问编号 EE" />
      </div>
    </header>

    <div class="shell">
      <main class="workspace">
        <section class="page-head">
          <div>
            <div class="title-row">
              <h1 id="pageTitle">OIC 经营看板</h1>
              <select class="scope-select" id="scopeSelect" aria-label="看板范围">
                <option value="oic">OIC</option>
                <option value="team">团队</option>
                <option value="dept">部门</option>
              </select>
            </div>
            <div class="health">数据更新时间 2026-05-05 11:30</div>
          </div>
        </section>

        <section class="kpis" id="kpiArea"></section>

        <section class="dashboard-grid">
          <article class="panel chart-panel" id="trendPanel">
            <div class="panel-head">
              <div>
                <h2 id="trendTitle"></h2>
                <div class="meta" id="trendMeta">最近 30 天，单位：亿港元</div>
              </div>
              <div class="toolbar">
                <div class="range-toggle" aria-label="趋势周期">
                  <button class="range-btn" data-window="7">7天</button>
                  <button class="range-btn active" data-window="30">30天</button>
                </div>
                <button class="icon-btn expand-btn" data-expand="trendPanel" title="放大/缩小">⛶</button>
              </div>
            </div>
            <svg id="lineChart" viewBox="0 0 420 210" role="img" aria-label="趋势图"></svg>
          </article>

          <article class="panel chart-panel" id="monthPanel">
            <div class="panel-head">
              <div>
                <h2 id="monthTitle"></h2>
                <div class="meta">月度余额/收入与环比速度</div>
              </div>
              <div class="toolbar">
                <button class="icon-btn expand-btn" data-expand="monthPanel" title="放大/缩小">⛶</button>
              </div>
            </div>
            <svg id="barChart" viewBox="0 0 420 210" role="img" aria-label="月度柱线图"></svg>
          </article>

          <article class="panel" id="rankPanel">
            <div class="panel-head">
              <div>
                <h2 id="rankTitle"></h2>
                <div class="meta" id="rankMeta"></div>
              </div>
              <div class="toolbar"><button class="icon-btn expand-btn" data-expand="rankPanel" title="放大/缩小">⛶</button></div>
            </div>
            <table id="rankTable"></table>
          </article>
        </section>

        <article class="panel customer-section" id="customerPanel">
          <div class="panel-head">
            <div>
              <h2 id="customerTitle"></h2>
              <div class="meta" id="customerMeta"></div>
            </div>
            <div class="toolbar"><button class="icon-btn expand-btn" data-expand="customerPanel" title="放大/缩小">⛶</button></div>
          </div>
          <table id="customerTable"></table>
        </article>
      </main>

      <div class="resizer" id="assistantResizer" title="拖动调整问答框宽度"></div>

      <aside class="assistant">
        <div class="assistant-head">
          <span>MAVA AI智能财会助手</span>
          <div class="assistant-actions">
            <button class="icon-btn" id="resetCtxBtn" title="清空上下文">↻</button>
            <button class="icon-btn" id="assistantExpandBtn" title="放大/缩小助手">⛶</button>
          </div>
        </div>
        <div class="assistant-body">
          <section class="context" id="contextCard">
            <div class="context-title">
              <span>看板联动对象</span>
              <span class="sync-pill">已同步点击</span>
            </div>
            <div class="ctx-grid" id="ctxGrid"></div>
            <div class="ctx-note" id="ctxNote"></div>
          </section>
          <section class="analysis" id="analysisBox"></section>
          <div class="meta" style="font-weight:900;color:#334155;margin:0 0 9px">推荐问题</div>
          <section class="question-grid" id="questionGrid"></section>
          <div class="event-log" id="eventLog">等待交互。</div>
        </div>
        <div class="assistant-footer">
          <div class="assistant-buttons" id="moduleButtons">
            <button class="secondary primary" data-module="query">查询数据</button>
            <button class="secondary" data-module="report">生成报告</button>
            <button class="secondary" data-module="knowledge">知识问答</button>
          </div>
          <div class="ask">
            <input id="askInput" placeholder="输入问题，例如：为什么变化、只看贸易融资、生成报告" />
            <button class="send" id="sendBtn">发送</button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const DATA = {
      deposit: {
        code:"DEP_BAL", name:"存款", kind:"balance", value:56.90, unit:"亿港元",
        d:+0.19, dp:"+0.35%", m:+2.74, mp:"+5.07%", y:+7.16, yp:"+14.41%",

          ["MA_N12_1","发行存款证",5.80,-0.16,"-2.7%"],
          ["MA_N112_2","定期存款 - CMB 分润",3.90,0.24,"+3.2%"],

      loan: {

        trend:"贷款 30 天趋势", month:"贷款按月趋势", rank:"贷款产品贡献", customer:"客户按贷款贡献 Top20",
        products:[
          ["MA_M111_1","房产按揭贷款",20.40,-0.06,"-0.3%"],
          ["MA_M111_8","贸易融资",9.80,0.32,"+3.4%"],
          ["MA_M111_7","银团贷款",7.60,-0.18,"-2.3%"],
          ["MA_M111_3","个人贷款",6.10,0.09,"+1.5%"],
          ["MA_M111_4","税务贷款",4.20,0.16,"+4.1%"],
          ["MA_M111_9","支票贴现",3.80,-0.05,"-1.2%"],
          ["MA_M111_6","定期循环贷款",2.90,0.11,"+3.8%"]

    function series(){
      const k = state.metric;
      const base = {deposit:55.1, loan:60.4, nii:.82, fee:1.05}[k];
      const drift = {deposit:.038, loan:-.004, nii:.006, fee:.009}[k];
      const full = Array.from({length:30},(_,i)=> base + Math.sin(i/3.8)*.24 + i*drift + (i%9===0 ? .07 : 0));
      return state.trendWindow === 7 ? full.slice(-7) : full;
    }

    function smoothPath(points){
      if(points.length < 2) return "";
      let d = `M${points[0][0].toFixed(1)},${points[0][1].toFixed(1)}`;
      for(let i=1;i<points.length;i++){
        const [x0,y0] = points[i-1], [x1,y1] = points[i];
        const cx = (x0 + x1) / 2;
        d += ` C${cx.toFixed(1)},${y0.toFixed(1)} ${cx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
      }
      return d;
    }

    function renderLine(){
      const vals = series();

      const w=420,h=210,p=34;

      const path = smoothPath(pts);
      const area = `${path} L ${pts[pts.length-1][0].toFixed(1)},${h-p} L ${p},${h-p} Z`;
      const maxIdx = vals.indexOf(Math.max(...vals));

        <g>

        </g>
        <text x="${pts[maxIdx][0]-14}" y="${pts[maxIdx][1]-10}" font-size="10" fill="#057a55">高点</text>
        <text x="${pts[minIdx][0]-14}" y="${pts[minIdx][1]+18}" font-size="10" fill="#64748b">低点</text>
        <text x="${p}" y="${h-7}" font-size="12" fill="#64748b">${firstLabel}</text>
        <text x="${w/2-18}" y="${h-7}" font-size="12" fill="#64748b">${state.trendWindow === 7 ? "05-02" : "04-21"}</text>
        <text x="${w-p-35}" y="${h-7}" font-size="12" fill="#64748b">05-05</text>`;
    }

    function renderBars(){
      const k = state.metric;
      const w=420,h=210,p=38;
      const base = [4.2,4.8,5.2,5.0,5.6,6.0,5.3,5.5,5.9,6.1,6.35,6.55];
      const scale = {deposit:9.2, loan:9.4, nii:.18, fee:.23}[k];
      const vals = base.map((v,i)=>v*scale + (i%4===0 ? scale*.16 : 0));
      const max = Math.max(...vals)*1.18;
      const monthEnds = ["06/30","07/31","08/31","09/30","10/31","11/30","12/31","01/31","02/28","03/31","04/30","05/31"];
      const step = (w - p * 2) / 11;
      const bars = vals.map((v,i)=>{
        const cx = p + i * step;
        const x = cx - 8;
        const y = h-p-v/max*(h-2*p);
        return `<rect x="${x}" y="${y}" width="16" height="${h-p-y}" rx="4" fill="url(#barGrad)"/>
          <line x1="${cx}" x2="${cx}" y1="${h-p}" y2="${h-p+4}" stroke="#94a3b8"/>
          <text x="${cx}" y="${h-9}" text-anchor="middle" font-size="8.5" fill="#64748b">${monthEnds[i]}</text>`;
      }).join("");
      const growth = vals.map((_,i)=> (Math.sin(i/1.9)+1.35)/2.75);
      const pts = growth.map((v,i)=>[p+i*step,h-p-v*(h-2*p)]);
      const path = smoothPath(pts);
      byId("barChart").innerHTML = `
        <defs>
          <linearGradient id="barGrad" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#0aa0ad"/><stop offset="1" stop-color="#087f8c"/></linearGradient>

        ${bars}
        <path d="${path}" fill="none" stroke="#c20f1f" stroke-width="2.6"/>
        ${pts.map((pt,i)=>`<circle cx="${pt[0]}" cy="${pt[1]}" r="${i===pts.length-1 ? 4.5 : 3.4}" fill="#fff" stroke="#c20f1f" stroke-width="2"/>`).join("")}
        ${pts.filter((_,i)=>[2,5,8,11].includes(i)).map((pt,i)=>`<text x="${pt[0]-10}" y="${pt[1]-9}" font-size="10" fill="#c20f1f">${["+4.8%","+7.1%","+3.2%","+5.6%"][i]}</text>`).join("")}`;
    }

      btn.onclick = () => switchModule(btn.dataset.module, true);
    });
    byId("resetCtxBtn").onclick = () => {
      state.product = null;
      state.customer = null;
      state.activeModule = "query";
      state.moduleLocked = false;
      render();
      flash("contextCard");
      log("已清空产品与客户上下文。");
    };
    byId("assistantExpandBtn").onclick = () => {
      const shell = document.querySelector(".shell");
      const current = getComputedStyle(shell).getPropertyValue("--assistant-width").trim() || "440px";
      shell.style.setProperty("--assistant-width", current === "720px" ? "440px" : "720px");
    };
    byId("sendBtn").onclick = () => {
      const text = byId("askInput").value.trim();
      if(!text) return;
      if(text.includes("报告")) switchModule("report", true);
      else if(text.includes("口径") || text.includes("是什么")) switchModule("knowledge", true);
      else switchModule("query", false);
      if(text.includes("贸易融资") && state.metric === "loan"){
        selectProduct("MA_M111_8");
      }else{
        flash("analysisBox");
      }
      log(`自然语言追问：${text}`);
      byId("askInput").value = "";
    };
    byId("askInput").addEventListener("keydown", e => { if(e.key === "Enter") byId("sendBtn").click(); });

    function initAssistantResizer(){
      const shell = document.querySelector(".shell");
      const resizer = byId("assistantResizer");
      let dragging = false;
      const clamp = (value,min,max) => Math.max(min,Math.min(max,value));
      const setWidth = width => shell.style.setProperty("--assistant-width", `${clamp(width,320,760)}px`);
      resizer.addEventListener("pointerdown", event => {
        dragging = true;
        resizer.classList.add("dragging");
        resizer.setPointerCapture(event.pointerId);
        document.body.style.userSelect = "none";
      });
      resizer.addEventListener("pointermove", event => {
        if(!dragging) return;
        const shellRect = shell.getBoundingClientRect();
        setWidth(shellRect.right - event.clientX);
      });
      const stop = event => {
        if(!dragging) return;
        dragging = false;
        resizer.classList.remove("dragging");
        document.body.style.userSelect = "";
        if(event.pointerId !== undefined && resizer.hasPointerCapture(event.pointerId)){
          resizer.releasePointerCapture(event.pointerId);
        }
      };
      resizer.addEventListener("pointerup", stop);
      resizer.addEventListener("pointercancel", stop);
    }

    initAssistantResizer();
    render();
  </script>
</body>
</html>
