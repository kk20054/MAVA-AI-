<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAVA AI 经营看板 Demo</title>
  <style>
    :root{
      --red:#c20f1f;
      --red-dark:#8f0d18;
      --red-soft:#fff1f3;
      --teal:#087f8c;
      --teal-soft:#e8f7f8;
      --green:#057a55;
      --amber:#b7791f;
      --ink:#172033;
      --muted:#64748b;
      --line:#d7dee9;
      --soft:#f4f7fb;
      --panel:#fff;
      --blue:#2c5aa0;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--soft);
      color:var(--ink);
      font-family:"Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;
      letter-spacing:0;
    }
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{
      min-height:100vh;
      min-width:1180px;
      display:grid;
      grid-template-rows:64px 1fr;
    }
    .topbar{
      display:flex;
      align-items:center;
      gap:18px;
      background:#fff;
      border-bottom:1px solid var(--line);
      padding:0 22px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      width:232px;
      font-weight:900;
      font-size:25px;
      white-space:nowrap;
    }
    .brand-mark{
      width:36px;
      height:36px;
      border:3px solid var(--red);
      color:var(--red);
      border-radius:50%;
      display:grid;
      place-items:center;
      font-weight:900;
      font-size:18px;
    }
    .title{
      padding-left:18px;
      border-left:1px solid var(--line);
      font-size:18px;
      font-weight:800;
      min-width:320px;
    }
    .top-actions{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .control{
      height:38px;
      border:1px solid var(--line);
      background:#fff;
      color:#334155;
      border-radius:7px;
      padding:0 12px;
      min-width:130px;
    }
    .shell{
      min-height:0;
      display:grid;
      grid-template-columns:68px minmax(780px,1fr) 440px;
    }
    .rail{
      border-right:1px solid var(--line);
      background:#fff;
      padding:14px 9px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .nav-btn{
      height:44px;
      width:50px;
      border:0;
      border-radius:8px;
      background:#fff;
      color:#5b6b84;
      font-weight:800;
    }
    .nav-btn.active{
      background:var(--red-soft);
      color:var(--red);
      border-left:3px solid var(--red);
    }
    .workspace{
      overflow:auto;
      padding:18px;
    }
    .page-head{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:18px;
      margin-bottom:12px;
    }
    .page-head h1{
      margin:0;
      font-size:22px;
      line-height:1.25;
    }
    .tabs{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .seg{
      height:32px;
      border:1px solid var(--line);
      background:#fff;
      color:#475569;
      border-radius:7px;
      padding:0 12px;
    }
    .seg.active{
      background:#172033;
      color:#fff;
      border-color:#172033;
    }
    .health{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
    }
    .health::before{
      content:"";
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--green);
    }
    .kpis{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
      margin-bottom:12px;
    }
    .kpi{
      position:relative;
      min-height:150px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--panel);
      padding:14px;
      overflow:hidden;
      transition:transform .16s ease,box-shadow .16s ease,border .16s ease;
      text-align:left;
    }
    .kpi:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(20,31,54,.07)}
    .kpi.active{
      border:2px solid var(--red);
      background:linear-gradient(180deg,#fff5f6 0%,#fff 78%);
    }
    .kpi.active::after{
      content:"ACTIVE";
      position:absolute;
      top:12px;
      right:12px;
      color:var(--red-dark);
      font-weight:900;
      font-size:11px;
      letter-spacing:0;
    }
    .kpi-name{font-size:15px;font-weight:900;margin-bottom:14px}
    .kpi-value{font-size:32px;font-weight:900;line-height:1.1}
    .kpi-unit{font-size:13px;color:#475569;margin-left:5px;font-weight:700}
    .kpi-grid{
      margin-top:13px;
      display:grid;
      grid-template-columns:58px 1fr 62px;
      gap:4px 7px;
      font-size:12px;
      color:#334155;
      align-items:center;
    }
    .pos{color:var(--green);font-weight:800}
    .neg{color:var(--red);font-weight:800}
    .warn{color:var(--amber);font-weight:800}
    .dashboard-grid{
      display:grid;
      grid-template-columns:1fr 1fr 1.18fr;
      gap:12px;
      margin-bottom:12px;
    }
    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:8px;
      min-height:292px;
      padding:14px;
    }
    .panel-head{
      display:flex;
      justify-content:space-between;
      align-items:start;
      gap:12px;
      margin-bottom:9px;
    }
    .panel h2{
      margin:0;
      font-size:16px;
      line-height:1.3;
    }
    .meta{
      color:var(--muted);
      font-size:12px;
      margin-top:3px;
      line-height:1.35;
    }
    .toolbar{
      display:flex;
      gap:6px;
    }
    .icon-btn{
      width:30px;
      height:30px;
      border:1px solid var(--line);
      border-radius:7px;
      background:#fff;
      color:#475569;
      font-weight:900;
    }
    svg{display:block;width:100%;height:210px}
    table{
      width:100%;
      border-collapse:collapse;
      font-size:12px;
    }
    th{
      text-align:left;
      background:#f1f5f9;
      color:#475569;
      padding:8px;
      border-bottom:1px solid var(--line);
      font-weight:900;
      white-space:nowrap;
    }
    td{
      padding:7px 8px;
      border-bottom:1px solid #e9eef5;
      white-space:nowrap;
    }
    tr[data-row]{cursor:pointer}
    tr[data-row]:hover td{background:#fff8f8}
    tr.selected td{background:var(--red-soft)!important}
    .bar-wrap{
      position:relative;
      min-width:78px;
    }
    .bar-bg{
      position:absolute;
      left:8px;
      top:9px;
      height:13px;
      border-radius:3px;
      background:var(--teal);
      opacity:.16;
      min-width:8px;
    }
    .bar-bg.down{background:var(--red)}
    .bar-text{position:relative;font-weight:900}
    .customer-section{
      min-height:290px;
      margin-bottom:14px;
    }
    .split-row{
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:12px;
    }
    .alerts{
      display:grid;
      gap:9px;
    }
    .alert{
      border:1px solid #e6d7b9;
      background:#fffaf0;
      border-radius:7px;
      padding:11px 12px;
      font-size:12px;
      line-height:1.45;
    }
    .alert b{display:block;color:#7c4a03;margin-bottom:3px}
    .assistant{
      min-width:0;
      border-left:1px solid var(--line);
      background:#fff;
      display:grid;
      grid-template-rows:58px 1fr;
    }
    .assistant-head{
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      font-weight:900;
      font-size:17px;
    }
    .assistant-actions{
      display:flex;
      gap:6px;
    }
    .assistant-body{
      overflow:auto;
      padding:15px;
    }
    .context{
      border:1px solid #efb8be;
      background:#fffafa;
      border-radius:8px;
      padding:13px;
      margin-bottom:12px;
      position:relative;
    }
    .context::before{
      content:"";
      position:absolute;
      left:-16px;
      top:46px;
      width:16px;
      height:2px;
      background:var(--red);
    }
    .context-title{
      color:var(--red-dark);
      font-weight:900;
      margin-bottom:10px;
    }
    .ctx-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px 12px;
      font-size:13px;
    }
    .ctx-grid span{
      display:block;
      color:var(--muted);
      font-size:11px;
      margin-bottom:3px;
    }
    .ctx-code{
      margin-top:10px;
      color:#8f0d18;
      font-size:12px;
      line-height:1.4;
      word-break:break-word;
    }
    .analysis{
      border:1px solid var(--line);
      background:#f8fafc;
      border-radius:8px;
      padding:14px;
      margin-bottom:13px;
      font-size:13px;
      line-height:1.65;
    }
    .analysis h3{
      margin:0 0 8px;
      font-size:15px;
    }
    .analysis p{margin:7px 0}
    .action-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
      margin-bottom:13px;
    }
    .action-card{
      min-height:72px;
      text-align:left;
      border:1px solid var(--line);
      background:#fff;
      border-radius:8px;
      padding:11px;
      color:#334155;
    }
    .action-card:hover{
      background:var(--teal-soft);
      border-color:#9dd2d7;
    }
    .action-card b{
      display:block;
      color:#111827;
      margin-bottom:5px;
      font-size:13px;
    }
    .ask{
      border:1px solid var(--line);
      border-radius:8px;
      height:44px;
      display:flex;
      align-items:center;
      padding:0 8px;
      gap:8px;
      background:#fff;
    }
    .ask input{
      flex:1;
      min-width:0;
      border:0;
      outline:0;
      color:#334155;
      font-size:13px;
    }
    .send{
      height:30px;
      border:0;
      border-radius:7px;
      background:var(--red);
      color:#fff;
      padding:0 12px;
      font-weight:800;
    }
    .assistant-buttons{
      display:flex;
      gap:8px;
      margin-top:10px;
      flex-wrap:wrap;
    }
    .secondary{
      height:34px;
      border:1px solid var(--line);
      background:#fff;
      color:#334155;
      border-radius:7px;
      padding:0 11px;
    }
    .secondary.primary{
      border-color:#9dd2d7;
      background:var(--teal-soft);
      color:var(--teal);
      font-weight:900;
    }
    .event-log{
      margin-top:12px;
      border-top:1px dashed var(--line);
      padding-top:10px;
      font-size:12px;
      color:var(--muted);
      line-height:1.55;
    }
    .flash{animation:flash .55s ease}
    @keyframes flash{
      0%{box-shadow:0 0 0 0 rgba(194,15,31,.28)}
      100%{box-shadow:0 0 0 12px rgba(194,15,31,0)}
    }
    @media(max-width:1480px){
      .shell{grid-template-columns:62px minmax(720px,1fr) 410px}
      .brand{width:210px;font-size:22px}
      .dashboard-grid{grid-template-columns:1fr 1fr}
      .dashboard-grid .panel:nth-child(3){grid-column:1 / 3}
      .kpi-value{font-size:28px}
      .top-actions .control:nth-child(3){display:none}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">工</div><span>ICBC ASIA</span></div>
      <div class="title">MAVA AI 智能财会助手 · 经营看板</div>
      <div class="top-actions">
        <select class="control" id="viewSelect" aria-label="视角">
          <option value="OIC">OIC 视角</option>
          <option value="MO">MO 视角</option>
        </select>
        <input class="control" id="dateInput" value="2026-05-05" aria-label="数据日期" />
        <input class="control" id="oicInput" value="EE001408023" aria-label="OIC 编号" />
        <select class="control" id="currencySelect" aria-label="币种">
          <option>港元</option>
          <option>人民币折算</option>
          <option>美元折算</option>
        </select>
      </div>
    </header>

    <div class="shell">
      <nav class="rail" aria-label="主导航">
        <button class="nav-btn">数</button>
        <button class="nav-btn active">板</button>
        <button class="nav-btn">报</button>
        <button class="nav-btn">知</button>
        <button class="nav-btn">设</button>
      </nav>

      <main class="workspace">
        <section class="page-head">
          <div>
            <h1 id="pageTitle">OIC 经营驾驶舱</h1>
            <div class="health">数据更新时间 2026-05-05 11:30，MAVA 管会口径</div>
          </div>
          <div class="tabs" aria-label="看板范围">
            <button class="seg active" data-scope="oic">OIC</button>
            <button class="seg" data-scope="team">团队</button>
            <button class="seg" data-scope="dept">部门</button>
          </div>
        </section>

        <section class="kpis" id="kpiArea"></section>

        <section class="dashboard-grid">
          <article class="panel">
            <div class="panel-head">
              <div>
                <h2 id="trendTitle"></h2>
                <div class="meta">最近 30 天，单位：百万港元</div>
              </div>
              <div class="toolbar"><button class="icon-btn">+</button><button class="icon-btn">...</button></div>
            </div>
            <svg id="lineChart" viewBox="0 0 420 210" role="img"></svg>
          </article>

          <article class="panel">
            <div class="panel-head">
              <div>
                <h2 id="monthTitle"></h2>
                <div class="meta">月度余额/收入与环比速度</div>
              </div>
              <div class="toolbar"><button class="icon-btn">+</button><button class="icon-btn">...</button></div>
            </div>
            <svg id="barChart" viewBox="0 0 420 210" role="img"></svg>
          </article>

          <article class="panel" id="rankPanel">
            <div class="panel-head">
              <div>
                <h2 id="rankTitle"></h2>
                <div class="meta" id="rankMeta"></div>
              </div>
              <div class="toolbar"><button class="icon-btn">R</button></div>
            </div>
            <table id="rankTable"></table>
          </article>
        </section>

        <section class="split-row">
          <article class="panel customer-section" id="customerPanel">
            <div class="panel-head">
              <div>
                <h2 id="customerTitle"></h2>
                <div class="meta" id="customerMeta"></div>
              </div>
              <div class="toolbar"><button class="icon-btn">C</button></div>
            </div>
            <table id="customerTable"></table>
          </article>

          <article class="panel">
            <div class="panel-head">
              <div>
                <h2>经营关注</h2>
                <div class="meta">规则引擎 + analysis_pack 生成</div>
              </div>
            </div>
            <div class="alerts" id="alerts"></div>
          </article>
        </section>
      </main>

      <aside class="assistant">
        <div class="assistant-head">
          <span>AI 分析助手</span>
          <div class="assistant-actions"><button class="icon-btn">↻</button><button class="icon-btn">□</button></div>
        </div>
        <div class="assistant-body">
          <section class="context" id="contextCard">
            <div class="context-title">当前上下文</div>
            <div class="ctx-grid" id="ctxGrid"></div>
            <div class="ctx-code" id="ctxCode"></div>
          </section>
          <section class="analysis" id="analysisBox"></section>
          <div class="meta" style="font-weight:900;color:#334155;margin:0 0 9px">推荐动作</div>
          <section class="action-grid" id="actionGrid"></section>
          <div class="ask">
            <input id="askInput" placeholder="输入追问，例如：为什么变化、只看贸易融资、生成报告" />
            <button class="send" id="sendBtn">发送</button>
          </div>
          <div class="assistant-buttons">
            <button class="secondary primary" id="filterBtn">筛选看板</button>
            <button class="secondary" id="reportBtn">生成报告</button>
            <button class="secondary" id="detailBtn">附加明细</button>
          </div>
          <div class="event-log" id="eventLog">等待交互。</div>
        </div>
      </aside>
    </div>
  </div>

        code:"NON_INTEREST_INCOME", name:"非息收入", value:1.28, unit:"亿港元",
        d:+0.01, dp:"+5.79%", m:+0.18, mp:"+16.38%", y:+0.53, yp:"+70.67%",
        trend:"非息收入 30 天趋势", month:"非息收入按月趋势", rank:"非息收入来源 Rank", customer:"客户按非息收入贡献 Top20",
        products:[
          ["MA_A12_1","收费及佣金收入",0.62,0.07,"+12.5%"],
          ["MA_A13_1","交易业务净收入",0.28,0.04,"+16.0%"],
          ["MA_A13_0","财资业务净收入",0.19,0.03,"+14.1%"],
          ["MA_A13_2","FVPL 金融资产及负债净收益",0.13,0.02,"+11.8%"],
          ["MA_A12_2","收费及佣金支出抵减",0.06,-0.01,"-3.2%"]
        ],
        customers:["Summit Securities Ltd.","Central Wealth Ltd.","Oriental Asset Mgmt Ltd.","Prime Insurance Brokers Ltd.","Union Global Markets Ltd.","Navigator Advisory Ltd."],
        insight:"非息收入月内增长较快，主要来自收费及佣金收入和交易业务净收入。需要区分一次性收入与可持续收入。",
        alerts:["非息收入增幅较高，建议标注一次性因素。","交易业务净收入波动较强，不宜直接外推。","收费及佣金收入可进一步拆为客户和产品贡献。"]
      }
    };

    const state = { metric:"deposit", product:null, customer:null, action:"overview", scope:"oic" };
    const metricOrder = ["deposit","loan","lowcost","fee"];
    const metric = () => DATA[state.metric];
    const money = v => `${v >= 0 ? "+" : ""}${v.toFixed(2)}`;
    const cls = value => String(value).startsWith("-") || value < 0 ? "neg" : "pos";
    const byId = id => document.getElementById(id);

    function flash(id){
      const el = byId(id);
      el.classList.remove("flash");
      void el.offsetWidth;
      el.classList.add("flash");
    }
    function log(msg){
      byId("eventLog").textContent = `${new Date().toLocaleTimeString()} · ${msg}`;
    }

    function renderKpis(){
      byId("kpiArea").innerHTML = metricOrder.map(key => {
        const m = DATA[key];
        const active = key === state.metric ? " active" : "";
        return `<button class="kpi${active}" data-metric="${key}">
          <div class="kpi-name">${m.name}</div>
          <div class="kpi-value">${m.value.toFixed(2)}<span class="kpi-unit">${m.unit}</span></div>
          <div class="kpi-grid">
            <span>较昨日</span><b>${money(m.d)}</b><b class="${cls(m.dp)}">${m.dp}</b>
            <span>较上月</span><b>${money(m.m)}</b><b class="${cls(m.mp)}">${m.mp}</b>
            <span>较年初</span><b>${money(m.y)}</b><b class="${cls(m.yp)}">${m.yp}</b>
          </div>
        </button>`;
      }).join("");
      document.querySelectorAll(".kpi").forEach(btn => btn.onclick = () => selectMetric(btn.dataset.metric));
    }

    function series(){
      const k = state.metric;
      const base = {deposit:55.1, loan:60.4, lowcost:16.9, fee:1.05}[k];
      const drift = {deposit:.038, loan:-.004, lowcost:.032, fee:.009}[k];
      return Array.from({length:30},(_,i)=> base + Math.sin(i/3.8)*.24 + i*drift + (i%9===0 ? .07 : 0));
    }

    function renderLine(){
      const vals = series();
      const min = Math.min(...vals)-.18, max = Math.max(...vals)+.18;
      const w=420,h=210,p=30;
      const pts = vals.map((v,i)=>[p+i*(w-2*p)/29,h-p-(v-min)/(max-min)*(h-2*p)]);
      const path = pts.map((p,i)=>(i ? "L" : "M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
      byId("lineChart").innerHTML = `
        <defs><linearGradient id="lineFill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#c20f1f" stop-opacity=".16"/><stop offset="1" stop-color="#c20f1f" stop-opacity="0"/></linearGradient></defs>
        ${[0,1,2,3].map(i=>`<line x1="${p}" x2="${w-p}" y1="${p+i*(h-2*p)/3}" y2="${p+i*(h-2*p)/3}" stroke="#e5ebf3"/>`).join("")}
        <path d="${path} L ${w-p},${h-p} L ${p},${h-p} Z" fill="url(#lineFill)"/>
        <path d="${path}" fill="none" stroke="#c20f1f" stroke-width="3"/>
        ${pts.filter((_,i)=>i%5===0 || i===29).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="#c20f1f" stroke-width="2"/>`).join("")}
        <text x="${p}" y="${h-7}" font-size="12" fill="#64748b">04-06</text>
        <text x="${w/2-18}" y="${h-7}" font-size="12" fill="#64748b">04-21</text>
        <text x="${w-p-35}" y="${h-7}" font-size="12" fill="#64748b">05-05</text>`;
    }

    function renderBars(){
      const k = state.metric;
      const w=420,h=210,p=32;
      const base = [4.2,4.8,5.2,5.0,5.6,6.0,5.3,5.5,5.9,6.1,6.35,6.55];
      const scale = {deposit:9.2, loan:9.4, lowcost:2.9, fee:.23}[k];
      const vals = base.map((v,i)=>v*scale + (i%4===0 ? scale*.16 : 0));
      const max = Math.max(...vals)*1.16;
      const bars = vals.map((v,i)=>{
        const x = p+i*30;
        const y = h-p-v/max*(h-2*p);
        return `<rect x="${x}" y="${y}" width="19" height="${h-p-y}" rx="2" fill="#087f8c"/><text x="${x+5}" y="${h-8}" font-size="11" fill="#64748b">${i+1}</text>`;
      }).join("");
      const pts = vals.map((_,i)=>[p+9+i*30,h-p-(Math.sin(i/1.9)+1.35)/2.75*(h-2*p)]);
      const path = pts.map((p,i)=>(i ? "L" : "M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
      byId("barChart").innerHTML = `
        ${[0,1,2].map(i=>`<line x1="${p}" x2="${w-p}" y1="${p+i*(h-2*p)/2}" y2="${p+i*(h-2*p)/2}" stroke="#e5ebf3"/>`).join("")}
        ${bars}
        <path d="${path}" fill="none" stroke="#c20f1f" stroke-width="2.5"/>
        ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="#c20f1f" stroke-width="2"/>`).join("")}
        <text x="298" y="22" font-size="12" fill="#c20f1f">环比速度</text>`;
    }

    function renderRank(){
      const m = metric();
      byId("rankMeta").textContent = state.scope === "oic" ? "按产品层级排序，可筛选客户" : "按同层级单位排序，可对比贡献";
      byId("rankTable").innerHTML = `<tr><th>Rank</th><th>产品/来源</th><th>余额/收入</th><th>较上月</th><th>增幅</th></tr>` +
        m.products.map((r,i)=>{
          const selected = state.product && state.product.code === r[0] ? " selected" : "";
          return `<tr data-row="product" data-code="${r[0]}" class="${selected}">
            <td>${i+1}</td><td>${r[1]}</td><td>${r[2].toFixed(2)}</td>
            <td class="bar-wrap"><span class="bar-bg ${r[3]<0?"down":""}" style="width:${Math.min(Math.abs(r[3])*42,96)}px"></span><span class="bar-text ${cls(r[3])}">${money(r[3])}</span></td>
            <td class="${cls(r[4])}">${r[4]}</td>
          </tr>`;
        }).join("");
      document.querySelectorAll('tr[data-row="product"]').forEach(row => row.onclick = () => selectProduct(row.dataset.code));
    }

    function renderCustomers(){
      const m = metric();
      const productName = state.product ? ` · ${state.product.name}` : "";
      byId("customerTitle").textContent = `${m.customer}${productName}`;
      byId("customerMeta").textContent = "金额单位与当前指标一致，Demo 展示前 6 名";
      byId("customerTable").innerHTML = `<tr><th>Rank</th><th>客户名称</th><th>类型</th><th>行业</th><th>${m.name}</th><th>较上月</th><th>占比</th></tr>` +
        m.customers.map((c,i)=>{
          const selected = state.customer === c ? " selected" : "";
          const val = state.metric === "fee" ? .16-i*.018 : 7.08-i*.58;
          const chg = .57-i*.05;
          return `<tr data-row="customer" data-customer="${c}" class="${selected}">
            <td>${i+1}</td><td>${c}</td><td>${i<4?"Corporate":"SME"}</td>
            <td>${["Manufacturing","Trading","Real Estate","Logistics","Financial Services","Retail"][i]}</td>
            <td>${val.toFixed(2)}</td><td class="${cls(chg)}">${money(chg)}</td><td>${(1.39-i*.13).toFixed(2)}%</td>
          </tr>`;
        }).join("");
      document.querySelectorAll('tr[data-row="customer"]').forEach(row => row.onclick = () => selectCustomer(row.dataset.customer));
    }

    function renderAlerts(){
      byId("alerts").innerHTML = metric().alerts.map((a,i)=>`<div class="alert"><b>${["口径提示","经营异动","下钻建议"][i]}</b>${a}</div>`).join("");
    }

    function contextObject(){
      const m = metric();
      return {
        module:"OIC_DASHBOARD",
        date:byId("dateInput").value,
        scope:state.scope.toUpperCase(),
        oic_id:byId("oicInput").value,
        metric_code:m.code,
        metric_name:m.name,
        selected_visual:state.customer ? "customer_topn" : state.product ? "product_rank" : "kpi_card",
        product_code:state.product ? state.product.code : null,
        product_name:state.product ? state.product.name : null,
        customer_name:state.customer,
        currency:byId("currencySelect").value
      };
    }

    function renderAssistant(){
      const m = metric();
      const ctx = contextObject();
      byId("ctxGrid").innerHTML = [
        ["指标",ctx.metric_name],
        ["范围",`${ctx.scope} / ${ctx.oic_id}`],
        ["日期",ctx.date],
        ["产品",ctx.product_name || "全部产品"],
        ["客户",ctx.customer_name || "未选中"],
        ["币种",ctx.currency]
      ].map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join("");
      byId("ctxCode").textContent = `metric_code=${ctx.metric_code}${ctx.product_code ? ", product_code="+ctx.product_code : ""}${ctx.customer_name ? ", customer="+ctx.customer_name : ""}`;
      let title = ctx.customer_name ? `客户贡献分析：${ctx.customer_name}` : ctx.product_name ? `产品贡献分析：${ctx.product_name}` : `${m.name}总览分析`;
      let second = state.action === "report"
        ? "当前 analysis_pack 可传入生成报告模块，形成经营亮点、经营关注和证据口径。"
        : state.action === "filter"
        ? "助手已生成 filter_request，正式环境中由前端更新上下文并重新调用指标服务。"
        : state.action === "rank"
        ? "产品 Rank 展示当前指标的主要拉动和拖累来源，可进一步点击产品定位客户贡献。"
        : state.action === "top"
        ? "客户 TopN 用于识别核心贡献客户和集中度，客户级数据应记录访问审计。"
        : m.insight;
      byId("analysisBox").innerHTML = `<h3>${title}</h3>
        <p>当前${m.name}为 <b>${m.value.toFixed(2)}${m.unit}</b>，较上月 <b>${money(m.m)}</b>，增幅 <b class="${cls(m.mp)}">${m.mp}</b>。</p>
        <p>${second}</p>
        <p>建议先看产品贡献，再看客户 TopN；如需正式材料，可直接生成 OIC 摘要。</p>`;
      const actions = [
        ["drivers","分析变动原因","产品、客户、时间三维归因"],
        ["rank","查看产品 Rank","定位拉动和拖累项"],
        ["top","查看 Top20 客户","识别核心贡献客户"],
        ["report","生成 OIC 摘要","输出可复用报告段落"]
      ];
      byId("actionGrid").innerHTML = actions.map(a=>`<button class="action-card" data-action="${a[0]}"><b>${a[1]}</b>${a[2]}</button>`).join("");
      document.querySelectorAll(".action-card").forEach(btn => btn.onclick = () => selectAction(btn.dataset.action));
    }

    function render(){
      const m = metric();
      byId("trendTitle").textContent = m.trend;
      byId("monthTitle").textContent = m.month;
      byId("rankTitle").textContent = m.rank;
      renderKpis();
      renderLine();
      renderBars();
      renderRank();
      renderCustomers();
      renderAlerts();
      renderAssistant();
    }

    function selectMetric(key){
      state.metric = key;
      state.product = null;
      state.customer = null;
      state.action = "overview";
      render();
      flash("contextCard");
      log(`切换指标：${DATA[key].name}。`);
    }
    function selectProduct(code){
      const r = metric().products.find(x => x[0] === code);
      state.product = {code:r[0], name:r[1]};
      state.customer = null;
      state.action = "product";
      render();
      flash("customerPanel");
      flash("contextCard");
      log(`筛选产品：${r[1]}。`);
    }
    function selectCustomer(name){
      state.customer = name;
      state.action = "customer";
      render();
      flash("contextCard");
      log(`进入客户上下文：${name}。`);
    }
    function selectAction(action){
      state.action = action;
      renderAssistant();
      if(action === "rank") flash("rankPanel");
      if(action === "top") flash("customerPanel");
      if(action === "report" || action === "filter") flash("analysisBox");
      log(`执行动作：${action}。`);
    }

    document.querySelectorAll(".seg").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".seg").forEach(x=>x.classList.remove("active"));
        btn.classList.add("active");
        state.scope = btn.dataset.scope;
        byId("pageTitle").textContent = state.scope === "oic" ? "OIC 经营驾驶舱" : state.scope === "team" ? "团队经营驾驶舱" : "部门经营驾驶舱";
        renderAssistant();
        log(`切换范围：${btn.textContent}。`);
      };
    });
    byId("viewSelect").onchange = e => {
      byId("pageTitle").textContent = e.target.value === "OIC" ? "OIC 经营驾驶舱" : "MO 管理层驾驶舱";
      renderAssistant();
    };
    ["dateInput","oicInput","currencySelect"].forEach(id => byId(id).onchange = () => renderAssistant());
    byId("sendBtn").onclick = () => {
      const text = byId("askInput").value.trim();
      if(!text) return;
      state.action = text.includes("报告") ? "report" : text.includes("客户") ? "top" : text.includes("产品") || text.includes("贸易融资") ? "rank" : "drivers";
      if(text.includes("贸易融资") && state.metric === "loan"){
        selectProduct("MA_M111_8");
      }else{
        renderAssistant();
        flash("analysisBox");
      }
      log(`自然语言追问：${text}`);
      byId("askInput").value = "";
    };
    byId("askInput").addEventListener("keydown", e => { if(e.key === "Enter") byId("sendBtn").click(); });
    byId("filterBtn").onclick = () => selectAction("filter");
    byId("reportBtn").onclick = () => selectAction("report");
    byId("detailBtn").onclick = () => { flash("customerPanel"); log("已附加产品 Rank 和客户 TopN 明细。"); };

    render();
  </script>
</body>
</html>
