def main(args: dict) -> dict:
    """
    生成报告模块 - 意图守卫路由脚本 v7.2
    输入: guard_output (意图守卫LLM原始输出), query (用户原始问题)
    输出: is_redirect (bool), redirect_message (str)
    """
    import json

    guard_output = args.get('guard_output', '').strip()
    user_query = str(args.get('query', '') or '')

    # ═══════ 1. 解析 LLM 输出 ═══════
    action = 'proceed'
    llm_message = ''
    try:
        si = guard_output.find('{')
        ei = guard_output.rfind('}')
        if si != -1 and ei != -1:
            parsed = json.loads(guard_output[si:ei + 1])
            action = parsed.get('action', 'proceed')
            llm_message = parsed.get('message', '')
    except Exception:
        action = 'proceed'

    # ═══════ 2. 关键词安全网（二次校验，防误拦） ═══════
    REPORT_PROCEED_KW = [
        '报告', '分析报告', '经营报告', '业绩报告', '诊断报告',
        '汇报', '生成', '出一份', '制作', '导出', '做一份',
        '经营分析', '总结', '年度', '季度', '月度',
        # 财务数据词（可能想做含数据的报告）
        '余额', '收入', '贷款', '存款', '资产', '负债', '利润',
        '费用', '数据', '明细', '指标', '经营', '业绩', '管户',
        '情况', '趋势', '对比', '同比', '环比',
    ]
    EXTERNAL_SIGNALS = [
        'hibor', 'libor', 'sofr', 'shibor',
        '汇率', 'gdp', 'cpi', 'pmi',
        '建行', '中银香港', '汇丰', '恒生银行', '渣打', '花旗',
        '基准利率', '美联储', '央行', '银行业', '宏观经济',
    ]

    if action != 'proceed' and user_query:
        q_lower = user_query.lower()
        has_report_kw = any(kw in q_lower for kw in REPORT_PROCEED_KW)
        has_external = any(kw in q_lower for kw in EXTERNAL_SIGNALS)
        if has_report_kw and not has_external:
            action = 'proceed'

    # ═══════ 3. 未知 action → 默认放行 ═══════
    if action not in ('proceed', 'redirect_knowledge'):
        action = 'proceed'

    # ═══════ 4. 输出 ═══════
    if action == 'proceed':
        return {'is_redirect': False, 'redirect_message': ''}

    if not llm_message or len(llm_message.strip()) < 10:
        llm_message = (
            '您的问题更适合在「知识问答」模块中获得解答，'
            '请点击切换至「知识问答」模块。\n\n'
            '💡 在「生成报告」模块中，您可以这样提问：\n'
            '• 帮我出一份上月的经营分析报告\n'
            '• 生成客户经理的业绩报告\n'
            '• 出一份年度经营报告'
        )

    return {'is_redirect': True, 'redirect_message': llm_message}